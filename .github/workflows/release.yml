name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Create Release Package
        run: |
          mkdir -p release-dist
          cp -r dist release-dist/
          cp -r package*.json release-dist/
          cp README.md release-dist/
          cd release-dist && zip -r ../phone-farm-release.zip . && cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: phone-farm-release.zip
          generate_release_notes: true
          draft: false
          prerelease: false
